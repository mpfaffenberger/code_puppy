name: Quality Checks

on:
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and Linux are release gates for 1.0, not follow-ups.
        # macos-latest is Apple Silicon (arm64). macos-15-intel runs the suite
        # on real x86_64, catching native binaries that only work on arm64.
        # It cannot catch missing x86_64 wheels (the runner ships Rust and would
        # quietly compile the sdist); the intel-mac-wheels job covers that.
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
        python-version: ['3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Setup uv virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

  intel-mac-wheels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install from wheels only (x86_64 macOS, every supported Python)
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          for python in 3.11 3.12 3.13 3.14; do
            echo "::group::Python $python"
            uv pip compile pyproject.toml --all-extras --quiet \
              --python-platform x86_64-apple-darwin --python-version "$python" \
              --output-file "$RUNNER_TEMP/requirements-$python.txt"
            uv pip install --dry-run --no-build \
              --python-platform x86_64-apple-darwin --python-version "$python" \
              --target "$RUNNER_TEMP/site-$python" \
              --requirements "$RUNNER_TEMP/requirements-$python.txt"
            echo "::endgroup::"
          done

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dev dependencies (ruff)
        # Keep in sync with the ruff pin in pyproject.toml. Unpinned ruff let
        # 0.16.0 sneak in and change the default rule set (5,901 "new" errors).
        run: pip install 'ruff>=0.15,<0.16'

      - name: Install code_puppy
        run: pip install .

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .
