# Publishes your package to PyPI using Astral/uv for builds.
# Set PYPI_API_TOKEN in repo secrets.

permissions:
  contents: write # Allows writing to the repository

name: Build and Publish to PyPI

# Two release lines publish from here during the 1.0 RC period:
#   main -> stable 0.0.x patches (what `uvx code-puppy` resolves to)
#   v1   -> 1.0.0rcN pre-releases (opt-in: `uvx code-puppy@1.0.0rcN`)
# See docs/upgrade/code_puppy_1_0_rewrite_plan.md, section 13.
on:
  push:
    branches:
      - main
      - v1

# Serialize publishes: two back-to-back pushes once raced, both bumped to the
# same patch version, and the loser stranded git a version behind PyPI.
# Queue (never cancel) so every push still gets released, one at a time.
concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ['3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Setup uv virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

  build-publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write # Allows writing to the repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv, build, and twine
        run: pip install uv build twine

      - name: Setup uv virtual environment
        run: uv venv

      - name: Bump version
        # `--bump patch` on 1.0.0rc1 yields a STABLE 1.0.1, so v1 must bump rc.
        run: |
          if [ "$GITHUB_REF_NAME" = "v1" ]; then
            uv version --bump rc
          else
            uv version --bump patch
          fi

      - name: Capture new version
        id: version
        run: |
          NEW_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Refuse a version that does not belong on this branch
        # twine (installed above) brings `packaging`, the guard's only import.
        run: python scripts/check_release_version.py "$GITHUB_REF_NAME" "${{ steps.version.outputs.version }}"

      - name: Build package
        run: |
          uv build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        # --skip-existing: if a version already reached PyPI from a run that
        # died before pushing its bump commit, warn instead of failing so the
        # bump+tag still land and the next run moves past the collision.
        run: uv run twine upload --verbose --skip-existing dist/*

      - name: Push version bump and tag to GitHub
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "chore: bump version [ci skip]" || echo "No changes to commit"
          TAG="v${{ steps.version.outputs.version }}"

          BRANCH="$GITHUB_REF_NAME"

          # The branch can advance between our checkout and this push (a human
          # or another branch landing a commit while we bump). The bare `git
          # push` used to fail the whole publish with "fetch first". Rebase
          # onto the latest branch tip and retry instead of going red.
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin "$BRANCH" 2>/dev/null; then
              echo "rebase conflicted/running; aborting and retrying"
              git rebase --abort 2>/dev/null || true
              sleep 5
              continue
            fi
            git tag -f -a "$TAG" -m "Release $TAG"
            if git push origin "$BRANCH"; then
              git push origin "$TAG" || echo "tag $TAG already exists remotely (fine)"
              echo "Pushed version bump and tag $TAG"
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5); retrying..."
            sleep 5
          done
          echo "Giving up pushing version bump after 5 attempts"
          exit 1
