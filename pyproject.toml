[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-puppy"
version = "1.0.0rc1"
description = "Code generation agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Code Puppy 1.0 is a distribution of pydantic-ai-pax (named pydantic-clai2
    # until 2026-11-19). pax pins pydantic-ai-harness and pydantic-ai-slim
    # exactly, so this one pin fixes the whole runtime. Do not add direct
    # harness/slim pins beside it.
    #
    # TEMPORARY: unpinned here because `[tool.uv.sources]` below builds it from a
    # commit on pydantic-ai `main`. Restore `pydantic-ai-pax==X.Y.Z` and delete
    # those sources before publishing: `scripts/check_release_version.py`
    # refuses to release until then.
    #
    # Every extra pax offers is installed, so nothing in Code Puppy answers
    # "support is not installed": the eight `/sandbox` providers, and the
    # `typesafe` model provider. `tests/test_optional_support.py` fails when
    # pax grows an extra that is not listed here.
    "pydantic-ai-pax[boxd,daytona,e2b,kubernetes,modal,opensandbox,render,sprites,typesafe]",
    # TEMPORARY: the deprecated alias package, which makes `import pydantic_clai2`
    # resolve to `pydantic_ai_pax`. `pydantic-claude-code` 0.7.x imports the
    # runtime under the old name. Drop this once a release of it imports
    # `pydantic_ai_pax`; until then pin it to the same version as pax.
    "pydantic-clai2",
    # Claude Code subscription models (`claude-code:` prefix, `/login claude-code`),
    # shipped as a built-in plugin. Mind the name: this is `pydantic-claude-code`.
    # `pydantic-ai-claude-code` on PyPI is an unrelated project by another author,
    # even though this package's repository and import name are spelled that way.
    "pydantic-claude-code>=0.7.5,<0.8",
    # Imported directly by code_puppy.update (version ordering, pre-releases).
    "packaging>=24.0",
]
authors = [
    {name = "Michael Pfaffenberger"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
repository = "https://github.com/mpfaffenberger/code_puppy"
HomePage = "https://github.com/mpfaffenberger/code_puppy"

[project.scripts]
code-puppy = "code_puppy.main:main_entry"
pup = "code_puppy.main:main_entry"

[tool.hatch.build]
packages = ["code_puppy"]

[tool.pytest.ini_options]
addopts = "--cov=code_puppy --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
python-preference = "only-managed"

# TEMPORARY: the runtime from pydantic-ai `main` at 000da4b4a (2026-11-20),
# which no release contains yet: `pydantic-ai-pax` is not on PyPI. All five
# come from the one commit, because pax pins the others to its own build. To
# move the pin, change every `rev`.
[tool.uv.sources]
pydantic-ai-pax = { git = "https://github.com/pydantic/pydantic-ai", rev = "000da4b4a05462d1b9989a9400c40bd4f9c8c8e7", subdirectory = "src/pydantic_ai_pax" }
pydantic-clai2 = { git = "https://github.com/pydantic/pydantic-ai", rev = "000da4b4a05462d1b9989a9400c40bd4f9c8c8e7", subdirectory = "src/pydantic_clai2" }
pydantic-ai-harness = { git = "https://github.com/pydantic/pydantic-ai", rev = "000da4b4a05462d1b9989a9400c40bd4f9c8c8e7", subdirectory = "src/pydantic_ai_harness" }
pydantic-ai-slim = { git = "https://github.com/pydantic/pydantic-ai", rev = "000da4b4a05462d1b9989a9400c40bd4f9c8c8e7", subdirectory = "pydantic_ai_slim" }
pydantic-graph = { git = "https://github.com/pydantic/pydantic-ai", rev = "000da4b4a05462d1b9989a9400c40bd4f9c8c8e7", subdirectory = "pydantic_graph" }

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.1.1",
    "pytest-asyncio>=0.23.1",
    "ruff>=0.15,<0.16",
]
