[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-puppy"
version = "0.0.788"
description = "Code generation agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "code-puppy-core-plugins>=0.0.27",
    "logfire>=4.0",
    # TEMPORARY (integration branch only): pinned to the pydantic-ai
    # CapabilityEvent/CustomEvent SDK via [tool.uv.sources] below.
    # #7794 has merged into the #6258 stack (branch `emit-custom-events`);
    # restore the PyPI pin once #6258 lands on main and releases.
    "pydantic-ai-slim[openai,anthropic,mcp]>=2.35.0",
    # Dogfood: speculative CodeMode + its capability events from the harness
    # POC branch (pydantic-ai-harness#699), sourced below.
    "pydantic-ai-harness[code-mode]",
    "anyio>=4.7.0",
    "typer>=0.12.0",
    "mcp>=1.9.4",
    "httpx[http2]>=0.24.1",
    "httpx2>=2.7",
    "requests>=2.28.0",
    "packaging>=24.0",
    "rich>=13.4.2",
    "pydantic>=2.4.0",
    "python-dotenv>=1.0.0",
    "json-repair>=0.46.2",
    "pyfiglet>=0.8.post1",
    "rapidfuzz>=3.13.0",
    "openai>=2.45.0",
    "ripgrep==14.1.0; sys_platform != 'android'",
    "playwright>=1.40.0; sys_platform != 'android'",
    "termflow-md>=0.9.0",
    "Pillow>=10.0.0",
    "azure-identity>=1.15.0",
    "anthropic>=1.0.0,<2",
    "boto3>=1.43.9",
    "keyring>=24.0.0",
    "agent-client-protocol>=0.11.0,<0.12",
]
dev-dependencies = [
    "pytest>=8.3.4",
    "pytest-cov>=6.1.1",
    "pytest-asyncio>=0.23.1",
    "ruff>=0.15,<0.16",
    "pexpect>=4.9.0",
]
authors = [
    {name = "Michael Pfaffenberger"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.35.0"]
durable = ["dbos>=2.11.0"]
computer-use = [
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]

[project.urls]
repository = "https://github.com/mpfaffenberger/code_puppy"
HomePage = "https://github.com/mpfaffenberger/code_puppy"


[project.scripts]
code-puppy = "code_puppy.main:main_entry"
pup = "code_puppy.main:main_entry"

[tool.logfire]
ignore_no_config = true

[tool.hatch.build]
packages = ["code_puppy"]

[tool.hatch.build.targets.wheel.shared-data]
"code_puppy/models.json" = "code_puppy/models.json"
"code_puppy/models_dev_api.json" = "code_puppy/models_dev_api.json"

[[tool.hatch.build.targets.sdist.include]]
path = "code_puppy/models.json"

[[tool.hatch.build.targets.sdist.include]]
path = "code_puppy/models_dev_api.json"

[tool.ruff.lint.per-file-ignores]
"code_puppy/main.py" = ["E402"]
"code_puppy/cli_runner.py" = ["E402"]
"code_puppy/messaging/__init__.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "--cov=code_puppy --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["code_puppy/main.py"]

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
# CapabilityEvent / on_event / emit_event SDK. #7794 fast-forwarded into
# `emit-custom-events` (the #6258 stack, base=main, still open); this SHA is
# that stack's head, containing #7794 plus five review-hardening commits.
# Pinned by commit SHA so builds are reproducible while the stack evolves.
pydantic-ai-slim = { git = "https://github.com/pydantic/pydantic-ai.git", rev = "8e7c6a4a01372c9efb31f81cef6a9d545a5df004", subdirectory = "pydantic_ai_slim" }
# Speculative CodeMode POC (pydantic-ai-harness#699); its branch pins the
# same pydantic-ai SDK rev as above. Restore PyPI pins when both release.
pydantic-ai-harness = { git = "https://github.com/pydantic/pydantic-ai-harness", branch = "spec-code-mode-poc" }

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.1.1",
    "pytest-asyncio>=0.23.1",
    "ruff>=0.15,<0.16",
    "pexpect>=4.9.0",
    "pyte>=0.8.2",
]
