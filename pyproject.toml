[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-puppy"
version = "1.0.0rc1"
description = "Code generation agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Code Puppy 1.0 is a distribution of pydantic-clai2. clai2 pins
    # pydantic-ai-harness and pydantic-ai-slim exactly, so this one pin fixes
    # the whole runtime. Do not add direct harness/slim pins beside it.
    "pydantic-clai2==0.68.0",
    # Claude Code subscription models (`claude-code:` prefix, `/login claude-code`),
    # shipped as a built-in plugin. Mind the name: this is `pydantic-claude-code`.
    # `pydantic-ai-claude-code` on PyPI is an unrelated project by another author,
    # even though this package's repository and import name are spelled that way.
    "pydantic-claude-code>=0.7.5,<0.8",
    # Imported directly by code_puppy.update (version ordering, pre-releases).
    "packaging>=24.0",
]
authors = [
    {name = "Michael Pfaffenberger"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
repository = "https://github.com/mpfaffenberger/code_puppy"
HomePage = "https://github.com/mpfaffenberger/code_puppy"

[project.scripts]
code-puppy = "code_puppy.main:main_entry"
pup = "code_puppy.main:main_entry"

[tool.hatch.build]
packages = ["code_puppy"]

[tool.pytest.ini_options]
addopts = "--cov=code_puppy --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.1.1",
    "pytest-asyncio>=0.23.1",
    "ruff>=0.15,<0.16",
]
