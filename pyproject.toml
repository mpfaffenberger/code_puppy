[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-puppy"
version = "1.0.0"
description = "Code generation agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Code Puppy 1.0 is a distribution of pydantic-ai-pax (named pydantic-clai2
    # until 2026-11-19). pax pins pydantic-ai-harness and pydantic-ai-slim
    # exactly, so this one pin fixes the whole runtime. Do not add direct
    # harness/slim pins beside it.
    #
    # Every extra pax offers is installed, so nothing in Code Puppy answers
    # "support is not installed": the ten `/sandbox` providers (the eight cloud
    # ones, plus BoxLite and SmolVM behind `local`), and the `typesafe` model
    # provider. `tests/test_optional_support.py` fails when pax grows an extra
    # that is not listed here.
    "pydantic-ai-pax[boxd,daytona,e2b,kubernetes,local,modal,opensandbox,render,sprites,typesafe]==0.75.0",
    # Neither is imported here. Both keep an Intel Mac install to pre-built
    # wheels, where a source build would need a Rust toolchain; the
    # `intel-mac-wheels` CI job fails without them. Drop each once its x86_64
    # macOS wheels return.
    # - cryptography 49+ publishes arm64-only macOS wheels; 48.x ships
    #   universal2. Transitive via pax, pyjwt and authlib.
    # - cbor2 6 has no Intel macOS wheel; 5.x is pure Python and satisfies
    #   modal's unpinned requirement.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cbor2<6; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Claude Code subscription models (`claude-code:` prefix, `/login claude-code`),
    # shipped as a built-in plugin. Mind the name: this is `pydantic-claude-code`.
    # `pydantic-ai-claude-code` on PyPI is an unrelated project by another author,
    # even though this package's repository and import name are spelled that way.
    "pydantic-claude-code>=0.7.5,<0.8",
    # Imported directly by code_puppy.update (version ordering, pre-releases).
    "packaging>=24.0",
]
authors = [
    {name = "Michael Pfaffenberger"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
repository = "https://github.com/mpfaffenberger/code_puppy"
HomePage = "https://github.com/mpfaffenberger/code_puppy"

[project.scripts]
code-puppy = "code_puppy.main:main_entry"
pup = "code_puppy.main:main_entry"

[tool.hatch.build]
packages = ["code_puppy"]

[tool.pytest.ini_options]
addopts = "--cov=code_puppy --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
# Every function says what it takes and returns, and a bare `Any` is not an
# answer: `object` for a value that is only passed on, the real type otherwise.
extend-select = ["ANN"]

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.1.1",
    "pytest-asyncio>=0.23.1",
    "ruff>=0.15,<0.16",
]
